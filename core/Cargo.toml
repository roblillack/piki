[package]
name = "piki-core"
description = "Core library for Piki personal wiki application"
version = "0.7.1"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# No default features: no libssh2/OpenSSL. Remote access over SSH goes through
# the system `ssh` binary via a custom smart-transport (see `src/git/ssh.rs`),
# so the user's keys, agent and ~/.ssh/config are used as-is.
git2 = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
